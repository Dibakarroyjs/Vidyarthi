<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Vidyarthi - Student Attendance Management System</title>

    <meta name="description" content="Vidyarthi is a student attendance management system designed to help manage students, subjects, attendance records, and eligibility efficiently.">

    <meta name="keywords" content="Vidyarthi, student attendance, attendance management system, student management, attendance calculator">

    <meta name="author" content="Vidyarthi">

    <!-- Website Icon (optional - future) -->
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Heading -->
    <h1>Vidyarthi</h1>

    <h2 class="page-section-title">Student List</h2>

    <div class="table-controls">

        <input type="text" id="searchInput" placeholder="Search...">

        <button id="saveStudents">Save</button>

        <button id="addButton">+</button>

        <button id="logoutButton">Logout</button>

    </div>

    <div class="table-container">
        
        <table id="studentTable">

            <thead>
                <tr>
                    <th>S. No</th>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Reg No.</th>
                    <th>Ph No.</th>
                    <th>Details</th>
                    <th>Yes/Not</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>


    <script type="module" src="js/script.js"></script>

</body>
</html>
